// ─── Firebase REST helpers ────────────────────────────────────────────────────
const fb = {
  async get(path) {
    try {
      const r = await fetch(`${DB_URL}/${path}.json`);
      return r.ok ? r.json() : null;
    } catch { return null; }
  },
  async set(path, data) {
    try {
      const r = await fetch(`${DB_URL}/${path}.json`, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      return r.ok ? r.json() : null;
    } catch { return null; }
  },
  async push(path, data) {
    try {
      const r = await fetch(`${DB_URL}/${path}.json`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...data, createdAt: Date.now() }),
      });
      return r.ok ? r.json() : null;
    } catch { return null; }
  },
  async patch(path, data) {
    try {
      const r = await fetch(`${DB_URL}/${path}.json`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      return r.ok ? r.json() : null;
    } catch { return null; }
  },
  async delete(path) {
    try {
      await fetch(`${DB_URL}/${path}.json`, { method: "DELETE" });
    } catch {}
  },
};

// ─── Helpers ──────────────────────────────────────────────────────────────────
const fmt = (n) => `₦${Number(n).toLocaleString()}`;
const Stars = ({ rating }) => (
  <span style={{ display: "flex", gap: 2, alignItems: "center" }}>
    {[1,2,3,4,5].map(i => <Icon.Star key={i} filled={i <= Math.round(rating)} />)}
  </span>
);
const Badge = ({ type, label }) => (
  <span className={`tag badge-${type}`}>{label || type}</span>
);

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimeout;
const showToast = (msg, setToast) => {
  setToast(msg);
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => setToast(""), 2500);
};

// ─── Product Card ─────────────────────────────────────────────────────────────
const ProductCard = ({ product, onView, onCart, onWish, isWished, compact }) => (
  <div
    className="card-hover"
    onClick={() => onView(product)}
    style={{
      background: "var(--dark)",
      border: "1px solid var(--border)",
      borderRadius: "var(--radius)",
      overflow: "hidden",
      cursor: "pointer",
      width: compact ? 160 : "100%",
      flexShrink: 0,
      position: "relative",
      animation: "fadeIn 0.4s ease",
    }}
  >
    <div style={{ position: "relative", aspectRatio: "3/4", overflow: "hidden" }}>
      <img
        src={product.image}
        alt={product.name}
        style={{ width: "100%", height: "100%", objectFit: "cover", transition: "transform 0.4s ease" }}
        onMouseEnter={e => e.currentTarget.style.transform = "scale(1.05)"}
        onMouseLeave={e => e.currentTarget.style.transform = "scale(1)"}
        onError={e => { e.currentTarget.src = "https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=400"; }}
      />
      <button
        onClick={e => { e.stopPropagation(); onWish(product); }}
        style={{
          position: "absolute", top: 10, right: 10,
          background: "rgba(0,0,0,0.6)", backdropFilter: "blur(8px)",
          border: "1px solid var(--border)", borderRadius: "50%",
          width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center",
          color: "var(--white)", transition: "all 0.2s",
        }}
      >
        <Icon.Heart filled={isWished} />
      </button>
      {product.badge && (
        <div style={{ position: "absolute", top: 10, left: 10 }}>
          <Badge type={product.badge === "new" ? "new" : product.badge === "bestseller" ? "bestseller" : product.badge === "luxury" ? "luxury" : "featured"} label={product.badge} />
        </div>
      )}
      {product.originalPrice > product.price && (
        <div style={{ position: "absolute", bottom: 10, left: 10, background: "#c0392b", color: "white", fontSize: 10, fontWeight: 700, padding: "2px 7px", borderRadius: 4 }}>
          -{Math.round((1 - product.price / product.originalPrice) * 100)}%
        </div>
      )}
    </div>
    <div style={{ padding: compact ? "10px 12px" : "14px 16px" }}>
      <p style={{ fontSize: compact ? 11 : 12, color: "var(--gray)", letterSpacing: 1, textTransform: "uppercase", marginBottom: 4 }}>
        {CATEGORIES.find(c => c.id === product.category)?.name}
      </p>
      <p style={{ fontWeight: 600, fontSize: compact ? 13 : 14, marginBottom: 6, lineHeight: 1.3 }}>{product.name}</p>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
        <Stars rating={product.rating} />
        <span style={{ fontSize: 11, color: "var(--gray)" }}>({product.reviews})</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <span className="gold-text" style={{ fontWeight: 700, fontSize: compact ? 14 : 16, fontFamily: "Cormorant Garamond, serif" }}>{fmt(product.price)}</span>
          {product.originalPrice > product.price && (
            <span style={{ fontSize: 11, color: "var(--gray)", textDecoration: "line-through", marginLeft: 6 }}>{fmt(product.originalPrice)}</span>
          )}
        </div>
        <button
          className="btn-gold"
          onClick={e => { e.stopPropagation(); onCart(product); }}
          style={{ padding: "6px 10px", borderRadius: 8, fontSize: 10 }}
        >+</button>
      </div>
    </div>
  </div>
);

// ─── Categories Page ──────────────────────────────────────────────────────────
const CategoriesPage = ({ products, onView, onCart, onWish, wishlist, initialCategory }) => {
  const [selected, setSelected] = useState(initialCategory || "all");
  const [sortBy, setSortBy] = useState("default");
  const [search, setSearch] = useState("");

  const filtered = products
    .filter(p => selected === "all" || p.category === selected)
    .filter(p => !search || p.name.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => {
      if (sortBy === "price-asc") return a.price - b.price;
      if (sortBy === "price-desc") return b.price - a.price;
      if (sortBy === "rating") return b.rating - a.rating;
      return 0;
    });

  return (
    <div style={{ paddingBottom: 80 }}>
      <div style={{ padding: "16px 20px", position: "sticky", top: 0, background: "rgba(8,8,8,0.95)", backdropFilter: "blur(12px)", zIndex: 100, borderBottom: "1px solid var(--border)" }}>
        <h1 className="serif" style={{ fontSize: 24, marginBottom: 12 }}>Shop All</h1>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1, background: "var(--dark2)", border: "1px solid var(--border)", borderRadius: 10, display: "flex", alignItems: "center", padding: "0 12px", gap: 8 }}>
            <Icon.Search />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search products..." style={{ background: "none", border: "none", color: "var(--white)", flex: 1, height: 40 }} />
          </div>
          <select value={sortBy} onChange={e => setSortBy(e.target.value)} style={{ background: "var(--dark2)", border: "1px solid var(--border)", borderRadius: 10, color: "var(--white)", padding: "0 12px", fontSize: 13 }}>
            <option value="default">Default</option>
            <option value="price-asc">Price ↑</option>
            <option value="price-desc">Price ↓</option>
            <option value="rating">Rating</option>
          </select>
        </div>
      </div>

      <div className="scrollbar-hide" style={{ display: "flex", gap: 8, padding: "12px 20px", overflowX: "auto" }}>
        {[{ id: "all", name: "All", icon: "✦" }, ...CATEGORIES].map(cat => (
          <button key={cat.id} onClick={() => setSelected(cat.id)} style={{
            flexShrink: 0, padding: "8px 16px", borderRadius: 100, fontSize: 12, fontWeight: 500,
            background: selected === cat.id ? "var(--gold)" : "var(--dark2)",
            color: selected === cat.id ? "var(--black)" : "var(--white)",
            border: `1px solid ${selected === cat.id ? "var(--gold)" : "var(--border)"}`,
            transition: "all 0.2s",
          }}>
            {cat.icon} {cat.name}
          </button>
        ))}
      </div>

      <div style={{ padding: "0 20px" }}>
        <p style={{ fontSize: 12, color: "var(--gray)", marginBottom: 16 }}>{filtered.length} products found</p>
        {filtered.length === 0 ? (
          <div style={{ textAlign: "center", padding: "60px 20px", color: "var(--gray)" }}>

const CheckoutPage = ({ cart, user, setCart, navigate, setToast }) => {
  const [form, setForm] = useState({ name: user?.name || "", phone: "", address: "", city: "", state: "", promoCode: "" });
  const [payMethod, setPayMethod] = useState("delivery");
  const [step, setStep] = useState(1);
  const [loading, setLoading] = useState(false);
  const [promoDiscount, setPromoDiscount] = useState(0);
  const [promoApplied, setPromoApplied] = useState(false);
  const PROMO_CODES = { "OCROWN10": 10, "FASHION20": 20, "LUXURY15": 15 };
  const subtotal = cart.reduce((s, i) => s + i.price * (i.qty || 1), 0);
  const total = subtotal - (subtotal * promoDiscount / 100);

  const applyPromo = () => {
    const disc = PROMO_CODES[form.promoCode.toUpperCase()];
    if (disc) { setPromoDiscount(disc); setPromoApplied(true); showToast(`${disc}% discount applied!`, setToast); }
    else showToast("Invalid promo code", setToast);
  };

  const placeOrder = async () => {
    if (!form.name || !form.phone || !form.address) { showToast("Please fill all required fields", setToast); return; }
    setLoading(true);
    const order = {
      customer: form,
      items: cart,
      total,
      paymentMethod: payMethod,
      status: "pending",
      userId: user?.uid || "guest",

    await fb.push("orders", order);
    setLoading(false);
    setCart([]);
    setStep(3);

// ─── Profile Page ─────────────────────────────────────────────────────────────
const ProfilePage = ({ user, setUser, navigate, setToast, darkMode, setDarkMode }) => {
  const [showLogin, setShowLogin] = useState(false);
  const [isRegister, setIsRegister] = useState(false);
  const [form, setForm] = useState({ name: "", email: "", password: "" });
  const [showPw, setShowPw] = useState(false);
  const [loading, setLoading] = useState(false);

  const handleAuth = async () => {
    if (!form.email || !form.password) { showToast("Fill all fields", setToast); return; }
    setLoading(true);
    // Simulate auth with Firebase REST (email/password)
    try {
      const action = isRegister ? "signUp" : "signInWithPassword";
      const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${action}?key=${FIREBASE_CONFIG.apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: form.email, password: form.password, returnSecureToken: true }),
      });
      const data = await res.json();
      if (data.error) { showToast(data.error.message.replace(/_/g, " "), setToast); }
      else {
        const userData = { uid: data.localId, email: data.email, name: form.name || data.email.split("@")[0], token: data.idToken };
        if (isRegister) await fb.set(`users/${data.localId}`, { name: form.name, email: form.email, createdAt: Date.now() });
        setUser(userData);
        setShowLogin(false);
        showToast(isRegister ? "Account created!" : "Welcome back!", setToast);
      }
    } catch { showToast("Authentication failed", setToast); }
    setLoading(false);
  };

  return (
    <div style={{ paddingBottom: 80 }}>
      <div style={{ padding: "16px 20px", position: "sticky", top: 0, background: "rgba(8,8,8,0.95)", backdropFilter: "blur(12px)", zIndex: 10, borderBottom: "1px solid var(--border)" }}>

          <div>
            <div style={{ textAlign: "center", padding: "32px 0 28px" }}>

              <p style={{ color: "var(--gray)", fontSize: 14 }}>Sign in to track orders and access exclusive deals</p>
            </div>
            <button className="btn-gold" onClick={() => setShowLogin(true)} style={{ width: "100%", padding: 16, borderRadius: 14, marginBottom: 12, fontSize: 14 }}>Sign In / Register</button>
          </div>
        ) : (
          <div>
            <div style={{ display: "flex", gap: 16, alignItems: "center", padding: "0 0 24px", marginBottom: 24, borderBottom: "1px solid var(--border)" }}>
              <div style={{ width: 60, height: 60, background: "linear-gradient(135deg, var(--gold-dark), var(--gold))", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, fontWeight: 700, color: "var(--black)" }}>
                {user.name[0].toUpperCase()}

              <div>
                <p style={{ fontWeight: 700, fontSize: 18, marginBottom: 2 }}>{user.name}</p>
                <p style={{ color: "var(--gray)", fontSize: 13 }}>{user.email}</p>
              </div>
            </div>
          </div>
        )}

        {[
          { icon: "📦", label: "My Orders", action: () => navigate("orders") },
          { icon: "💛", label: "Wishlist", action: () => navigate("wishlist") },
          { icon: "📍", label: "Delivery Addresses", action: null },

        ].map(item => (
          <button key={item.label} onClick={item.action || undefined} style={{
            width: "100%", display: "flex", alignItems: "center", gap: 14, padding: "16px 0",
            background: "none", border: "none", borderBottom: "1px solid var(--border)",
            color: "var(--white)", cursor: item.action ? "pointer" : "default", textAlign: "left",
          }}>
            <span style={{ fontSize: 20, width: 28, textAlign: "center" }}>{item.icon}</span>
            <span style={{ flex: 1, fontSize: 14 }}>{item.label}</span>

            {item.action && <Icon.ChevronRight />}
          </button>
        ))}

        {user && (
          <button onClick={() => { setUser(null); showToast("Signed out", setToast); }} style={{ display: "flex", alignItems: "center", gap: 10, color: "#f87171", background: "rgba(248,113,113,0.1)", border: "1px solid rgba(248,113,113,0.3)", borderRadius: 12, padding: "14px 20px", width: "100%", marginTop: 20, fontSize: 14 }}>

      </div>

      {showLogin && (
        <div className="modal-overlay" onClick={() => setShowLogin(false)}>

              <label style={{ fontSize: 12, color: "var(--gray)", display: "block", marginBottom: 6 }}>Email</label>
              <input type="email" value={form.email} onChange={e => setForm(p => ({ ...p, email: e.target.value }))} placeholder="you@example.com" style={{ width: "100%", background: "var(--dark2)", border: "1px solid var(--border)", borderRadius: 12, color: "var(--white)", padding: "12px 16px", fontSize: 14 }} />
            </div>
            <div style={{ marginBottom: 24 }}>
              <label style={{ fontSize: 12, color: "var(--gray)", display: "block", marginBottom: 6 }}>Password</label>
              <div style={{ position: "relative" }}>
                <input type={showPw ? "text" : "password"} value={form.password} onChange={e => setForm(p => ({ ...p, password: e.target.value }))} placeholder="••••••••" style={{ width: "100%", background: "var(--dark2)", border: "1px solid var(--border)", borderRadius: 12, color: "var(--white)", padding: "12px 44px 12px 16px", fontSize: 14 }} />
                <button onClick={() => setShowPw(!showPw)} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "var(--gray)" }}>
                  {showPw ? <Icon.EyeOff /> : <Icon.Eye />}

            </div>
            <button className="btn-gold" onClick={handleAuth} disabled={loading} style={{ width: "100%", padding: 16, borderRadius: 14, marginBottom: 14, fontSize: 14, opacity: loading ? 0.7 : 1 }}>

// ─── Admin Dashboard ──────────────────────────────────────────────────────────
const AdminPanel = ({ products, setProducts, navigate, setToast }) => {
  const [tab, setTab] = useState("overview");
  const [orders, setOrders] = useState([]);
  const [showAddProduct, setShowAddProduct] = useState(false);
  const [newProduct, setNewProduct] = useState({ name: "", category: "mens", price: "", originalPrice: "", description: "", image: "", stock: "", badge: "new", featured: false, newArrival: false });
  const [loading, setLoading] = useState(false);
  const ADMIN_PASS = "ocrown2024";
  const [authed, setAuthed] = useState(false);
  const [passInput, setPassInput] = useState("");

  useEffect(() => {
    if (authed) {
      fb.get("orders").then(data => {
        if (data) setOrders(Object.entries(data).map(([id, o]) => ({ id, ...o })).reverse());
      });
    }
  }, [authed]);

  if (!authed) return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "80vh", padding: 32 }}>
      <Icon.ShieldCheck />
      <h2 className="serif" style={{ fontSize: 28, margin: "20px 0 8px" }}>Admin Access</h2>
      <p style={{ color: "var(--gray)", marginBottom: 28, textAlign: "center" }}>Enter the admin password to access the dashboard</p>
      <input type="password" value={passInput} onChange={e => setPassInput(e.target.value)} placeholder="Admin password" onKeyDown={e => e.key === "Enter" && (passInput === ADMIN_PASS ? setAuthed(true) : showToast("Wrong password", setToast))} style={{ width: "100%", maxWidth: 320, background: "var(--dark2)", border: "1px solid var(--border)", borderRadius: 12, color: "var(--white)", padding: "14px 18px", fontSize: 15, marginBottom: 14, textAlign: "center" }} />
      <button className="btn-gold" onClick={() => passInput === ADMIN_PASS ? setAuthed(true) : showToast("Wrong password", setToast)} style={{ padding: "14px 40px", borderRadius: 14 }}>Enter Dashboard</button>
      <p style={{ color: "var(--gray)", fontSize: 12, marginTop: 12 }}>Hint: ocrown2024</p>
      <button onClick={() => navigate("back")} style={{ background: "none", border: "none", color: "var(--gray)", marginTop: 16, fontSize: 13 }}>← Go Back</button>
    </div>
  );

  const totalRevenue = orders.reduce((s, o) => s + (o.total || 0), 0);
  const STATUS_COLORS = { pending: "#f59e0b", processing: "#3b82f6", shipped: "#8b5cf6", delivered: "#22c55e", cancelled: "#ef4444" };

  const updateOrderStatus = async (orderId, status) => {
    await fb.patch(`orders/${orderId}`, { status });
    setOrders(o => o.map(ord => ord.id === orderId ? { ...ord, status } : ord));
    showToast("Status updated", setToast);
  };

  const addProduct = async () => {
    if (!newProduct.name || !newProduct.price) { showToast("Fill required fields", setToast); return; }
    setLoading(true);
    const id = "p" + Date.now();
    const product = { ...newProduct, id, price: +newProduct.price, originalPrice: +(newProduct.originalPrice || newProduct.price), stock: +(newProduct.stock || 10), rating: 4.5, reviews: 0 };
    await fb.set(`products/${id}`, product);
    setProducts(p => [...p, product]);
    setShowAddProduct(false);
    setNewProduct({ name: "", category: "mens", price: "", originalPrice: "", description: "", image: "", stock: "", badge: "new", featured: false, newArrival: false });
    showToast("Product added!", setToast);
    setLoading(false);
  };

  const deleteProduct = async (pid) => {
    await fb.delete(`products/${pid}`);
    setProducts(p => p.filter(x => x.id !== pid));
    showToast("Product deleted", setToast);
  };

    <div style={{ paddingBottom: 80 }}>
      <div style={{ padding: "16px 20px", position: "sticky", top: 0, background: "rgba(8,8,8,0.95)", backdropFilter: "blur(12px)", zIndex: 10, borderBottom: "1px solid var(--border)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>

          <button onClick={() => navigate("back")} style={{ background: "var(--dark2)", border: "1px solid var(--border)", borderRadius: 10, width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--white)" }}><Icon.ChevronLeft /></button>
          <h1 className="serif gold-text" style={{ fontSize: 20 }}>Admin Panel</h1>
        </div>
        <span style={{ fontSize: 11, background: "rgba(74,222,128,0.15)", color: "#4ade80", padding: "4px 10px", borderRadius: 100, border: "1px solid rgba(74,222,128,0.3)" }}>● Live</span>
      </div>

      {/* Tabs */}
      <div className="scrollbar-hide" style={{ display: "flex", borderBottom: "1px solid var(--border)", overflowX: "auto" }}>

// MAIN APP
// ═══════════════════════════════════════════════════════════════════════════════
function App() {
  const [splash, setSplash] = useState(true);
  const [page, setPage] = useState("home");
  const [pageParams, setPageParams] = useState(null);
  const [pageHistory, setPageHistory] = useState(["home"]);
  const [products, setProducts] = useState(SEED_PRODUCTS);
  const [cart, setCart] = useState([]);
  const [wishlist, setWishlist] = useState([]);
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [user, setUser] = useState(null);
  const [toast, setToast] = useState("");
  const [darkMode, setDarkMode] = useState(true);

  // Load products from Firebase
  useEffect(() => {
    (async () => {
      const data = await fb.get("products");
      if (data) {
        const list = Object.values(data);
        if (list.length > 0) setProducts(list);
      } else {
        // Seed DB
        for (const p of SEED_PRODUCTS) await fb.set(`products/${p.id}`, p);
      }
    })();
    setTimeout(() => setSplash(false), 2500);
  }, []);

  const navigate = (dest, params) => {
    if (dest === "back") {
      setPageHistory(h => {
        const newH = h.slice(0, -1);
        const prev = newH[newH.length - 1] || "home";
        setPage(prev);
        return newH;
      });
    } else {
      setPageHistory(h => [...h, dest]);
      setPage(dest);
      setPageParams(params || null);
    }
    window.scrollTo(0, 0);
  };

  const handleView = (product) => {
    setSelectedProduct(product);
    navigate("product");
  };

  const handleCart = (product) => {
    setCart(c => {
      const ex = c.find(i => i.id === product.id);
      if (ex) return c.map(i => i.id === product.id ? { ...i, qty: (i.qty || 1) + (product.qty || 1) } : i);
      return [...c, { ...product, qty: product.qty || 1 }];
    });
    showToast("Added to cart!", setToast);
  };

  const handleWish = (product) => {
    setWishlist(w => {
      const isIn = w.includes(product.id);
      showToast(isIn ? "Removed from wishlist" : "Saved to wishlist", setToast);
      return isIn ? w.filter(id => id !== product.id) : [...w, product.id];
    });
  };

  const NAV_TABS = [
    { id: "home", label: "Home", icon: <Icon.Home />, badge: null },
    { id: "categories", label: "Shop", icon: <Icon.Grid />, badge: null },
    { id: "cart", label: "Cart", icon: <Icon.Cart />, badge: cart.length || null },
    { id: "wishlist", label: "Saved", icon: <Icon.Heart />, badge: wishlist.length || null },
    { id: "profile", label: "Account", icon: <Icon.User />, badge: null },
  ];

  const showNav = !["product", "search", "checkout", "contact", "about", "admin"].includes(page);

  const renderPage = () => {
    const props = { navigate, setToast, user, products, setProducts };
    switch(page) {
      case "home": return <HomePage {...props} onView={handleView} onCart={handleCart} onWish={handleWish} wishlist={wishlist} />;
      case "categories": return <CategoriesPage {...props} onView={handleView} onCart={handleCart} onWish={handleWish} wishlist={wishlist} initialCategory={pageParams} />;
      case "product": return selectedProduct ? <ProductDetailPage product={selectedProduct} onCart={handleCart} onWish={handleWish} isWished={wishlist.includes(selectedProduct?.id)} setToast={setToast} navigate={navigate} products={products} onView={handleView} /> : null;
      case "search": return <SearchPage {...props} onView={handleView} onCart={handleCart} onWish={handleWish} wishlist={wishlist} />;
      case "cart": return <CartPage cart={cart} setCart={setCart} navigate={navigate} setToast={setToast} />;
      case "checkout": return <CheckoutPage cart={cart} user={user} setCart={setCart} navigate={navigate} setToast={setToast} />;
      case "orders": return <OrdersPage user={user} navigate={navigate} />;
      case "wishlist": return <WishlistPage products={products} wishlist={wishlist} onView={handleView} onCart={handleCart} onWish={handleWish} navigate={navigate} />;
      case "profile": return <ProfilePage user={user} setUser={setUser} navigate={navigate} setToast={setToast} darkMode={darkMode} setDarkMode={setDarkMode} />;
      case "contact": return <ContactPage navigate={navigate} />;
      case "about": return <AboutPage navigate={navigate} />;
      case "admin": return <AdminPanel products={products} setProducts={setProducts} navigate={navigate} setToast={setToast} />;
      default: return <HomePage {...props} onView={handleView} onCart={handleCart} onWish={handleWish} wishlist={wishlist} />;
    }
  };

  return (
    <>
      <GlobalStyle />
      {splash && <SplashScreen />}
      {!splash && (
        <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", background: "var(--black)", position: "relative", overflow: "hidden" }}>
          {/* Admin Access Button (top-right corner) */}
          {page === "home" && (
            <button onClick={() => navigate("admin")} style={{ position: "fixed", top: 10, right: "calc(50% - 240px + 10px)", zIndex: 200, background: "rgba(201,168,76,0.12)", border: "1px solid var(--border)", borderRadius: 8, padding: "4px 10px", fontSize: 10, color: "var(--gold)", letterSpacing: 1 }}>
              ADMIN
            </button>
          )}

          {/* Page Content */}
          <div style={{ minHeight: "100vh", paddingBottom: showNav ? 70 : 0 }}>
            {renderPage()}
          </div>

          {/* Bottom Nav */}
          {showNav && (
            <nav style={{
              position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
              width: "100%", maxWidth: 480,
              background: "rgba(10,10,10,0.96)", backdropFilter: "blur(20px)",
              borderTop: "1px solid var(--border)",
              display: "flex", zIndex: 500,
            }}>
              {NAV_TABS.map(tab => (
                <button key={tab.id} onClick={() => navigate(tab.id)} style={{
                  flex: 1, display: "flex", flexDirection: "column", alignItems: "center",
                  justifyContent: "center", padding: "10px 0", background: "none", border: "none",
                  color: page === tab.id ? "var(--gold)" : "var(--gray)", transition: "all 0.2s",
                  position: "relative",
                }}>
                  {tab.badge > 0 && (
                    <span style={{ position: "absolute", top: 6, right: "calc(50% - 14px)", background: "var(--gold)", color: "var(--black)", borderRadius: "50%", width: 16, height: 16, fontSize: 9, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", border: "2px solid var(--black)" }}>
                      {tab.badge > 9 ? "9+" : tab.badge}
                    </span>
                  )}
                  <span style={{ color: page === tab.id ? "var(--gold)" : "var(--gray)", transition: "all 0.2s", transform: page === tab.id ? "scale(1.1)" : "scale(1)", display: "block" }}>
                    {tab.icon}
                  </span>
                  <span style={{ fontSize: 10, marginTop: 3, fontWeight: page === tab.id ? 600 : 400 }}>{tab.label}</span>
                  {page === tab.id && <span style={{ position: "absolute", bottom: 0, width: 24, height: 2, background: "var(--gold)", borderRadius: 2 }} />}
                </button>
              ))}
            </nav>
          )}

          {/* Toast */}
          {toast && <div className="toast">{toast}</div>}
        </div>
      )}
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
