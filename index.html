// ============== AUTH ==============
onAuthStateChanged(auth,async user=>{
  currentUser=user;
  isAdmin=user&&user.email===ADMIN_EMAIL;
  updateAuthUI();
});

async function handleSignup(name,email,pass){
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await setDoc(doc(db,"users",cred.user.uid),{name,email,role:email===ADMIN_EMAIL?"admin":"user",createdAt:serverTimestamp(),cart:[],wishlist:[]});
    showToast("Account created! Welcome to BENIM ✨");
    navigate("home");
  }catch(e){showToast(e.message,"error");}
}
async function handleLogin(email,pass){
  try{
    await signInWithEmailAndPassword(auth,email,pass);
    showToast("Welcome back! ✨");
    if(email===ADMIN_EMAIL)navigate("admin");else navigate("home");
  }catch(e){showToast("Invalid credentials","error");}
}
async function handleLogout(){
  await signOut(auth);
  cart=[];wishlist=[];
  saveCart();saveWishlist();
  showToast("Logged out successfully");
  navigate("home");
}
async function handleGoogleLogin(){
  try{
    const provider=new GoogleAuthProvider();
    const cred=await signInWithPopup(auth,provider);
    const uref=doc(db,"users",cred.user.uid);
    const usnap=await getDoc(uref);
    if(!usnap.exists()){
      await setDoc(uref,{name:cred.user.displayName,email:cred.user.email,role:cred.user.email===ADMIN_EMAIL?"admin":"user",createdAt:serverTimestamp()});
    }
    showToast("Welcome! ✨");
    if(cred.user.email===ADMIN_EMAIL)navigate("admin");else navigate("home");
  }catch(e){showToast(e.message,"error");}
}

// ============== CART ==============
function saveCart(){localStorage.setItem("benim_cart",JSON.stringify(cart));}
function saveWishlist(){localStorage.setItem("benim_wishlist",JSON.stringify(wishlist));}
function saveRecent(){localStorage.setItem("benim_recent",JSON.stringify(recentlyViewed));}

function addToCart(product,size,color,qty=1){
  const existing=cart.find(i=>i.id===product.id&&i.size===size&&i.color===color);
  if(existing)existing.qty+=qty;
  else cart.push({...product,size,color,qty});
  saveCart();
  updateCartBadge();
  showToast("Added to cart 🛒");
}
function removeFromCart(idx){
  cart.splice(idx,1);
  saveCart();
  updateCartBadge();
  renderCart();
}
function updateQty(idx,delta){
  cart[idx].qty=Math.max(1,cart[idx].qty+delta);
  saveCart();
  renderCart();
}
function toggleWishlist(pid){
  const idx=wishlist.indexOf(pid);
  if(idx>-1)wishlist.splice(idx,1);
  else wishlist.push(pid);
  saveWishlist();
  updateWishlistUI();
  showToast(idx>-1?"Removed from wishlist":"Added to wishlist ❤️");
}
function isWishlisted(pid){return wishlist.includes(pid);}

function cartTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0);}
function cartCount(){return cart.reduce((s,i)=>s+i.qty,0);}

function addToRecent(product){
  recentlyViewed=recentlyViewed.filter(p=>p.id!==product.id);
  recentlyViewed.unshift(product);
  if(recentlyViewed.length>8)recentlyViewed.pop();
  saveRecent();
}

// ============== ORDERS ==============
async function placeOrder(orderData){
  try{
    const ref=await addDoc(collection(db,"orders"),{
      ...orderData,userId:currentUser?currentUser.uid:"guest",
      userEmail:currentUser?currentUser.email:orderData.email,
      status:"pending",createdAt:serverTimestamp(),
      items:cart.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty,size:i.size,color:i.color,image:i.images[0]})),
      total:cartTotal()-promoDiscount,promoCode,promoDiscount,
    });
    cart=[];promoCode="";promoDiscount=0;
    saveCart();updateCartBadge();
    showToast("Order placed! 🎉 Order ID: "+ref.id.slice(0,8).toUpperCase());
    navigate("orders");
    return ref.id;
  }catch(e){showToast("Order failed: "+e.message,"error");}
}

// ============== UI HELPERS ==============
function showToast(msg,type="success"){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.className="toast show"+(type==="error"?" error":"");
  setTimeout(()=>t.className="toast",3000);
}
function updateCartBadge(){
  const cnt=cartCount();
  document.querySelectorAll(".cart-badge").forEach(b=>{b.textContent=cnt;b.style.display=cnt>0?"flex":"none";});
}
function updateAuthUI(){
  document.querySelectorAll(".auth-only").forEach(el=>el.style.display=currentUser?"flex":"none");
  document.querySelectorAll(".guest-only").forEach(el=>el.style.display=currentUser?"none":"flex");
  document.querySelectorAll(".admin-only").forEach(el=>el.style.display=isAdmin?"flex":"none");
  if(currentUser){
    const n=document.getElementById("user-name");
    if(n)n.textContent=currentUser.displayName||currentUser.email.split("@")[0];
  }
}
function updateWishlistUI(){
  document.querySelectorAll(".wish-btn").forEach(btn=>{
    const pid=btn.dataset.pid;
    btn.classList.toggle("active",isWishlisted(pid));
    btn.innerHTML=isWishlisted(pid)?"❤️":"🤍";
  });
}
function formatPrice(p){return"₦"+p.toLocaleString("en-NG");}
function formatDate(ts){if(!ts)return"";const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString("en-NG",{day:"numeric",month:"short",year:"numeric"});}

function applyPromo(code){
  const p=promoCodes[code.toUpperCase()];
  if(p){
    promoCode=code.toUpperCase();
    if(p.type==="percent")promoDiscount=Math.round(cartTotal()*p.discount/100);
    else promoDiscount=p.discount;
    showToast(`Promo applied! You save ${formatPrice(promoDiscount)} 🎉`);
    renderCheckout();
  }else{showToast("Invalid promo code","error");}
}

// ============== NAVIGATION ==============
function navigate(page,data=null){
  currentPage=page;
  if(data)currentProduct=data;
  if(page==="category"&&data)currentCategory=data;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const target=document.getElementById("page-"+page);
  if(target){target.classList.add("active");target.scrollTop=0;}
  // Render page content
  if(page==="home")renderHome();
  else if(page==="cart")renderCart();
  else if(page==="wishlist")renderWishlist();
  else if(page==="product")renderProduct();
  else if(page==="category")renderCategory();
  else if(page==="checkout")renderCheckout();
  else if(page==="orders")renderOrders();
  else if(page==="admin")renderAdmin();
  else if(page==="search")renderSearch();
  else if(page==="profile")renderProfile();
  updateNav(page);
  window.scrollTo(0,0);
}

function updateNav(page){
  document.querySelectorAll(".nav-item").forEach(i=>i.classList.remove("active"));
  const map={home:"nav-home",categories:"nav-cats",cart:"nav-cart",wishlist:"nav-wish",profile:"nav-profile"};
  if(map[page]){const el=document.getElementById(map[page]);if(el)el.classList.add("active");}
}

function productCard(p,small=false){
  const disc=p.comparePrice?Math.round((1-p.price/p.comparePrice)*100):0;
  return`<div class="product-card${small?" small":""}" onclick="viewProduct('${p.id}')">
    <div class="product-img-wrap">
      <img src="${p.images[0]}" alt="${p.name}" loading="lazy"/>
      ${p.badge?`<span class="badge">${p.badge}</span>`:""}
      ${disc>0?`<span class="discount-badge">-${disc}%</span>`:""}
      <button class="wish-btn${isWishlisted(p.id)?" active":""}" data-pid="${p.id}" onclick="event.stopPropagation();toggleWishlist('${p.id}')">${isWishlisted(p.id)?"❤️":"🤍"}</button>
    </div>
    <div class="product-info">
      <div class="product-name">${p.name}</div>
      <div class="product-rating">${"★".repeat(Math.floor(p.rating))}${"☆".repeat(5-Math.floor(p.rating))} <span>(${p.reviews})</span></div>
      <div class="product-price">
        <span class="price-main">${formatPrice(p.price)}</span>
        ${p.comparePrice?`<span class="price-compare">${formatPrice(p.comparePrice)}</span>`:""}
      </div>
    </div>
  </div>`;
}

function getProducts(filter={}){
  let list=[...sampleProducts];
  if(filter.category)list=list.filter(p=>p.category===filter.category);
  if(filter.featured)list=list.filter(p=>p.featured);
  if(filter.bestSeller)list=list.filter(p=>p.bestSeller);
  if(filter.newArrival)list=list.filter(p=>p.newArrival);
  if(filter.search)list=list.filter(p=>p.name.toLowerCase().includes(filter.search.toLowerCase())||p.category.toLowerCase().includes(filter.search.toLowerCase()));
  return list;
}
function viewProduct(id){
  const p=sampleProducts.find(x=>x.id===id);
  if(p){addToRecent(p);navigate("product",p);}
}

async function loadAdminStats(){
  try{
    const ordersSnap=await getDocs(collection(db,"orders"));
    const usersSnap=await getDocs(collection(db,"users"));
    const orders=ordersSnap.docs.map(d=>({id:d.id,...d.data()}));
    const revenue=orders.reduce((s,o)=>s+(o.total||0),0);
    document.getElementById("stat-orders").textContent=orders.length;
    document.getElementById("stat-revenue").textContent=formatPrice(revenue);
    document.getElementById("stat-users").textContent=usersSnap.size;
    const preview=document.getElementById("admin-orders-preview");
    if(preview){
      preview.innerHTML=orders.length===0?`<div class="empty-state">No orders yet</div>`:`
      <div class="admin-orders-list">
        ${orders.slice(0,5).map(o=>`
        <div class="admin-order-row">
          <div>
            <div class="admin-order-id">#${o.id.slice(0,8).toUpperCase()}</div>
            <div class="admin-order-name">${o.name||"Guest"}</div>
          </div>
          <div>
            <div class="order-status ${o.status}">${o.status}</div>
            <div class="admin-order-total">${formatPrice(o.total||0)}</div>
          </div>
          <select class="status-select" onchange="updateOrderStatus('${o.id}',this.value)">
            ${["pending","confirmed","processing","shipped","delivered","cancelled"].map(s=>`<option value="${s}"${o.status===s?" selected":""}>${s}</option>`).join("")}
          </select>
        </div>`).join("")}
      </div>`;
    }
  }catch(e){console.error(e);}
}

window.updateOrderStatus=async function(id,status){

    showToast("Order status updated");
  }catch(e){showToast("Failed to update","error");}
};

window.showAdminTab=function(tab,btn){
  document.querySelectorAll(".admin-tab").forEach(t=>t.classList.remove("active"));
  if(btn)btn.classList.add("active");
  const content=document.getElementById("admin-content");
  if(!content)return;
  if(tab==="overview"){loadAdminStats();renderAdminOverview();}
  else if(tab==="orders")renderAdminOrders();
  else if(tab==="products")renderAdminProducts();
  else if(tab==="users")renderAdminUsers();
  else if(tab==="banners")renderAdminBanners();
};

window.addProductToDB=async function(){
  const name=document.getElementById("np-name")?.value.trim();
  const price=parseFloat(document.getElementById("np-price")?.value);
  const comparePrice=parseFloat(document.getElementById("np-compare")?.value)||0;
  const category=document.getElementById("np-cat")?.value;
  const description=document.getElementById("np-desc")?.value;
  const stock=parseInt(document.getElementById("np-stock")?.value)||0;
  const badge=document.getElementById("np-badge")?.value;
  const image=document.getElementById("np-img")?.value;
  if(!name||!price||!category){showToast("Fill required fields","error");return;}
  try{
    await addDoc(collection(db,"products"),{name,price,comparePrice,category,description,stock,badge,images:[image||""],rating:0,reviews:0,featured:false,bestSeller:false,newArrival:true,createdAt:serverTimestamp()});
    showToast("Product added! ✅");
    document.getElementById("add-product-form").style.display="none";
  }catch(e){showToast("Error: "+e.message,"error");}
};

  if(!name||!text){showToast("Please fill required fields","error");return;}

.product-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px;}
.option-section{margin-bottom:14px;}
.option-label{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;color:var(--text2);}
.option-selected{color:var(--gold);font-weight:600;}
.option-chips{display:flex;flex-wrap:wrap;gap:8px;}
.opt-chip{
  padding:7px 14px;border-radius:8px;
  font-size:12px;font-weight:600;
  background:var(--surface2);color:var(--text);
  border:1.5px solid var(--border);
  transition:all 0.2s;
}
.opt-chip.active{background:var(--gold);color:#000;border-color:var(--gold);}
.qty-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.qty-label{font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;}
.qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.qty-ctrl button{width:36px;height:36px;font-size:18px;background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center;}
.qty-ctrl span{width:44px;text-align:center;font-weight:700;font-size:15px;}
.atc-row{display:flex;flex-direction:column;gap:0;margin-bottom:16px;}
.product-meta{background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:16px;}
.meta-item{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.meta-item:last-child{margin-bottom:0;}
.share-row{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text3);}
.share-btn{background:var(--gold);color:#000;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;}
.reviews-section{background:var(--surface);padding:20px 16px;margin-top:8px;}
.review-summary{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:16px;}
.review-score{font-family:'Playfair Display',serif;font-size:48px;font-weight:700;color:var(--gold);}
.review-stars{color:var(--gold);font-size:16px;margin-bottom:4px;}
.review-count{font-size:12px;color:var(--text3);}
.review-card{padding:12px 0;border-bottom:1px solid var(--border);}
.reviewer{font-size:11px;color:var(--text3);margin-bottom:6px;}
.reviewer span{font-weight:700;color:var(--text);}
.review-text{font-size:13px;color:var(--text2);line-height:1.5;}

/* ===== CART ===== */
.cart-list{padding:0 16px;}
.cart-item{
  display:flex;gap:12px;padding:16px 0;
  border-bottom:1px solid var(--border);position:relative;
}
.cart-item-img{width:80px;height:80px;border-radius:12px;object-fit:cover;flex-shrink:0;cursor:pointer;}
.cart-item-info{flex:1;min-width:0;}
.cart-item-name{font-size:13px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-item-opts{font-size:10px;color:var(--text3);margin-bottom:6px;}
.cart-item-price{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px;}
.cart-qty-ctrl{display:flex;align-items:center;gap:12px;}
.cart-qty-ctrl button{width:28px;height:28px;border-radius:6px;background:var(--surface2);font-size:16px;display:flex;align-items:center;justify-content:center;}
.cart-qty-ctrl span{font-weight:700;font-size:14px;}
.cart-remove{position:absolute;top:16px;right:0;color:var(--text3);font-size:14px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.cart-summary{padding:16px;margin:16px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow2);}
.summary-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;color:var(--text2);}
.summary-total{display:flex;justify-content:space-between;font-size:16px;font-weight:700;padding:12px 0;border-top:1px solid var(--border);margin-bottom:16px;}
.cart-badge{
  position:absolute;top:-4px;right:-4px;
  background:var(--gold);color:#000;
  width:18px;height:18px;border-radius:50%;
  font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}

/* ===== CHECKOUT ===== */
.checkout-wrap{padding:16px;}
.checkout-section{
  background:var(--surface);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;
}
.checkout-title{font-size:14px;font-weight:700;letter-spacing:0.05em;margin-bottom:12px;}
.input-field{
  width:100%;padding:13px 16px;
  background:var(--surface2);
  border:1.5px solid var(--border);
  border-radius:12px;font-size:13px;color:var(--text);
  margin-bottom:10px;transition:border 0.2s;
}
.input-field:focus{border-color:var(--gold);}
.input-field::placeholder{color:var(--text3);}
.payment-options{display:flex;flex-direction:column;gap:10px;}
.payment-option{display:flex;}
.payment-option input[type="radio"]{display:none;}
.payment-card{
  display:flex;align-items:center;gap:12px;
  padding:14px;border-radius:12px;border:2px solid var(--border);
  background:var(--surface2);width:100%;cursor:pointer;
  transition:border-color 0.2s;
}
.payment-option input:checked+.payment-card{border-color:var(--gold);background:rgba(201,168,76,0.08);}
.payment-icon{font-size:24px;}
.payment-name{font-size:13px;font-weight:700;margin-bottom:2px;}
.payment-details{font-size:11px;color:var(--text3);line-height:1.5;}
.promo-row{display:flex;gap:8px;margin-bottom:8px;}
.promo-applied{font-size:11px;color:#2e7d32;font-weight:600;margin-bottom:4px;}
.promo-hint{font-size:10px;color:var(--text3);}
.order-line{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;color:var(--text2);}
.order-line.green{color:#2e7d32;}
.order-line.bold{font-weight:700;color:var(--text);font-size:14px;}
.order-divider{height:1px;background:var(--border);margin:8px 0;}
.secure-note{text-align:center;font-size:11px;color:var(--text3);margin-top:12px;}

/* ===== ORDERS ===== */
.orders-list{padding:16px;display:flex;flex-direction:column;gap:12px;}
.order-card{
  background:var(--surface);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow2);
}
.order-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.order-id{font-weight:700;font-size:14px;}
.order-date{font-size:11px;color:var(--text3);}
.order-status{
  padding:4px 10px;border-radius:20px;
  font-size:10px;font-weight:700;letter-spacing:0.05em;
}
.order-status.pending{background:#fff8e1;color:#f57c00;}
.order-status.confirmed{background:#e8f5e9;color:#2e7d32;}
.order-status.processing{background:#e3f2fd;color:#1565c0;}
.order-status.shipped{background:#f3e5f5;color:#7b1fa2;}
.order-status.delivered{background:#e8f5e9;color:#1b5e20;}
.order-status.cancelled{background:#ffebee;color:#c62828;}
.order-items-preview{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.order-items-preview img{width:40px;height:40px;border-radius:6px;object-fit:cover;}
.order-items-preview span{font-size:11px;color:var(--text3);}
.order-total{font-size:13px;font-weight:700;color:var(--gold);}
.order-payment{font-size:11px;color:var(--text3);margin-top:4px;}

/* ===== WISHLIST ===== */
.wish-btn.active{animation:heartPop 0.3s ease;}
@keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}

/* ===== AUTH ===== */
.auth-page{
  min-height:100vh;
  background:linear-gradient(160deg,#0a0a0a 0%,#1a1200 50%,#0a0a0a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;
}
.auth-logo{
  font-family:'Cormorant Garamond',serif;
  font-size:56px;font-weight:300;color:#fff;
  letter-spacing:0.3em;margin-bottom:8px;
}
.auth-tagline{font-size:10px;letter-spacing:0.4em;color:var(--gold);margin-bottom:40px;}
.auth-card{
  width:100%;max-width:400px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  border-radius:20px;padding:24px;
}
.auth-tabs{display:flex;gap:0;background:rgba(255,255,255,0.05);border-radius:12px;padding:4px;margin-bottom:20px;}
.auth-tab{
  flex:1;padding:10px;border-radius:8px;
  font-size:13px;font-weight:600;color:rgba(255,255,255,0.5);
  transition:all 0.2s;text-align:center;
}
.auth-tab.active{background:var(--gold);color:#000;}
.auth-card .input-field{
  background:rgba(255,255,255,0.07);
  border-color:rgba(255,255,255,0.1);
  color:#fff;
}
.auth-card .input-field::placeholder{color:rgba(255,255,255,0.3);}

/* ===== PROFILE ===== */
.profile-hero{
  background:linear-gradient(135deg,#0a0a0a,#1a1200);
  padding:40px 24px 32px;text-align:center;
}
.profile-avatar{
  width:72px;height:72px;border-radius:50%;
  background:var(--gold);color:#000;
  font-family:'Playfair Display',serif;
  font-size:28px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;
}
.profile-name{font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin-bottom:4px;}
.profile-email{font-size:12px;color:rgba(255,255,255,0.5);}
.admin-badge{display:inline-block;background:var(--gold);color:#000;font-size:10px;font-weight:700;padding:3px 12px;border-radius:20px;margin-top:10px;letter-spacing:0.1em;}
.profile-menu{padding:16px;}
.profile-item{
  display:flex;align-items:center;gap:14px;
  padding:16px 14px;border-radius:12px;
  background:var(--surface);margin-bottom:8px;
  width:100%;text-align:left;color:var(--text);
  box-shadow:var(--shadow2);
  font-size:13px;font-weight:600;
  justify-content:space-between;
}
.profile-item span:last-child{color:var(--text3);}
.profile-item.danger{color:#e53935;}
.profile-item.admin-item{background:rgba(201,168,76,0.1);border:1px solid var(--gold);}

/* ===== SEARCH ===== */
.search-input-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--surface2);border-radius:12px;padding:10px 14px;
  border:1.5px solid var(--border);
}
.search-input{
  flex:1;background:none;border:none;
  font-size:14px;color:var(--text);
}
.search-suggest{padding:20px 16px;}
.suggest-title{font-size:12px;font-weight:700;letter-spacing:0.1em;color:var(--text3);margin-bottom:12px;text-transform:uppercase;}
.suggest-chips{display:flex;flex-wrap:wrap;gap:8px;}
.suggest-chip{
  padding:8px 14px;border-radius:20px;
  font-size:12px;font-weight:600;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);cursor:pointer;
}
.search-count{padding:12px 16px;font-size:12px;color:var(--text3);}

/* ===== ABOUT ===== */
.about-hero{
  background:linear-gradient(135deg,#0a0a0a,#1a1200);
  padding:60px 24px;text-align:center;
}
.about-logo{font-family:'Cormorant Garamond',serif;font-size:48px;color:#fff;letter-spacing:0.3em;margin-bottom:12px;}
.about-tagline{font-size:11px;letter-spacing:0.3em;color:var(--gold);}
.about-content{padding:24px 20px;}
.about-content p{font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:14px;}
.about-values{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px;}
.about-val{
  background:var(--surface);border-radius:12px;padding:16px;
  display:flex;align-items:center;gap:10px;
  font-size:12px;font-weight:600;box-shadow:var(--shadow2);
}

/* ===== CONTACT ===== */
.contact-wrap{padding:20px 16px;}
.contact-intro{font-size:13px;color:var(--text2);text-align:center;margin-bottom:20px;line-height:1.6;}
.contact-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
.contact-card{
  display:flex;align-items:center;gap:16px;
  padding:18px;border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow2);
  color:var(--text);border:1px solid var(--border);
  transition:transform 0.2s;
}
.contact-card:active{transform:scale(0.98);}
.contact-icon{font-size:28px;flex-shrink:0;}
.contact-name{font-size:12px;font-weight:700;letter-spacing:0.05em;margin-bottom:2px;text-transform:uppercase;}
.contact-val{font-size:12px;color:var(--text2);margin-bottom:4px;}
.contact-cta{font-size:11px;color:var(--gold);font-weight:700;}
.bank-info{
  background:var(--surface);border-radius:var(--radius);
  padding:20px;margin-bottom:24px;border:1px solid var(--gold);
}
.bank-title{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:12px;}
.bank-detail{font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;gap:8px;}
.bank-detail span{font-weight:700;color:var(--text);min-width:60px;}
.contact-message{background:var(--surface);border-radius:var(--radius);padding:20px;}

/* ===== ADMIN ===== */
.admin-wrap{background:var(--bg);}
.admin-header{background:linear-gradient(135deg,#0a0a0a,#1a1200);}
.admin-header .page-title{color:#fff;}
.admin-header .back-btn{color:#fff;}
.admin-welcome{
  padding:20px 16px 8px;
  font-family:'Cormorant Garamond',serif;
  font-size:20px;color:var(--gold);
}
.admin-tabs{
  display:flex;gap:0;padding:0 16px 12px;
  overflow-x:auto;scrollbar-width:none;
}
.admin-tabs::-webkit-scrollbar{display:none;}
.admin-tab{
  padding:8px 14px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:0.05em;
  color:var(--text3);white-space:nowrap;flex-shrink:0;
  border:1px solid transparent;transition:all 0.2s;
}
.admin-tab.active{background:var(--gold);color:#000;border-color:var(--gold);}
.admin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 12px;}
.stat-card{
  background:var(--surface);border-radius:12px;padding:16px;
  text-align:center;box-shadow:var(--shadow2);
}
.stat-val{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--gold);}
.stat-label{font-size:10px;color:var(--text3);margin-top:4px;letter-spacing:0.05em;}
.admin-section-title{
  font-size:13px;font-weight:700;letter-spacing:0.08em;
  text-transform:uppercase;color:var(--text2);
  padding:0 16px;margin:12px 0 8px;
}
.admin-orders-list{padding:0 16px;}
.admin-order-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 0;border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.admin-order-id{font-weight:700;font-size:13px;}
.admin-order-name{font-size:11px;color:var(--text3);}
.admin-order-total{font-size:12px;font-weight:700;color:var(--gold);}
.status-select{
  padding:5px 8px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:11px;color:var(--text);font-family:inherit;
}
.admin-actions{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px;}
.admin-action-btn{
  padding:14px;background:var(--surface);border-radius:12px;
  text-align:left;font-size:13px;font-weight:600;
  box-shadow:var(--shadow2);color:var(--text);
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--border);
}
.admin-orders-full,.admin-users,.admin-banners,.admin-products{padding:0 16px 16px;}
.admin-order-card{
  background:var(--surface);border-radius:12px;
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow2);
}
.aoc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.aoc-info{font-size:11px;color:var(--text2);margin-bottom:4px;}
.aoc-items{font-size:11px;color:var(--text3);margin:8px 0;}
.aoc-bottom{display:flex;justify-content:space-between;align-items:center;}
.aoc-total{font-weight:700;color:var(--gold);}
.admin-user-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.admin-user-avatar{
  width:40px;height:40px;border-radius:50%;
  background:var(--gold);color:#000;
  font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.admin-user-info{flex:1;min-width:0;}
.admin-user-name{font-size:13px;font-weight:600;}
.admin-user-email{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.role-badge{padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;}
.role-badge.admin{background:rgba(201,168,76,0.15);color:var(--gold);}
.role-badge.user{background:var(--surface2);color:var(--text3);}
.admin-prod-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.admin-prod-list{display:flex;flex-direction:column;gap:10px;}
.admin-prod-row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:10px;box-shadow:var(--shadow2);}
.admin-prod-img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.admin-prod-info{flex:1;min-width:0;}
.admin-prod-name{font-size:12px;font-weight:700;margin-bottom:2px;}
.admin-prod-meta{font-size:11px;color:var(--gold);}
.admin-prod-cat{font-size:10px;color:var(--text3);}
.admin-prod-actions{display:flex;gap:6px;}
.action-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.action-btn.edit{background:rgba(201,168,76,0.1);}
.action-btn.del{background:rgba(229,57,53,0.1);}
.add-product-form{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow2);}
.form-row{display:flex;gap:8px;}
.banner-manage-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.banner-manage-item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:10px;box-shadow:var(--shadow2);}
.banner-thumb{width:64px;height:40px;border-radius:6px;object-fit:cover;}
.banner-manage-info{flex:1;}
.banner-manage-title{font-size:13px;font-weight:700;}
.banner-manage-sub{font-size:11px;color:var(--text3);}

/* ===== EMPTY / LOADING ===== */
.empty-state-full{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 24px;text-align:center;
  min-height:60vh;
}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:0.5;}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--text3);margin-bottom:24px;}
.empty-state{text-align:center;padding:40px;color:var(--text3);}
.loading-state{text-align:center;padding:40px;color:var(--text3);font-size:13px;}
.error-state{text-align:center;padding:40px;color:#e53935;font-size:13px;}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0a0a0a;color:#fff;
  padding:12px 20px;border-radius:50px;
  font-size:13px;font-weight:600;
  white-space:nowrap;
  opacity:0;transition:all 0.3s;
  z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.1);
  pointer-events:none;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:#c62828;}
[data-theme="dark"] .toast{background:#fff;color:#000;}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--nav-h);
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  z-index:200;
  backdrop-filter:blur(12px);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 24px rgba(0,0,0,0.06);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 16px;border-radius:16px;
  color:var(--text3);cursor:pointer;
  transition:all 0.2s;min-width:56px;
  position:relative;
}
.nav-item.active{color:var(--gold);}
.nav-item svg{transition:transform 0.2s;}
.nav-item.active svg{transform:scale(1.1);}
.nav-label{font-size:9px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;}

/* ===== INSTALL BTN ===== */
#install-btn{
  display:none;
  position:fixed;top:70px;right:12px;
  background:var(--gold);color:#000;
  padding:8px 14px;border-radius:20px;

<script>
// Inline manifest injection
const manifest={
  name:"BENIM — Luxury Fashion",
  short_name:"BENIM",
  description:"Premium fashion and lifestyle store",
  start_url:"./",
  display:"standalone",
  background_color:"#0a0a0a",
  theme_color:"#0a0a0a",
  orientation:"portrait",
  icons:[
    {src:"https://via.placeholder.com/192x192/c9a84c/000000?text=B",sizes:"192x192",type:"image/png"},
    {src:"https://via.placeholder.com/512x512/c9a84c/000000?text=B",sizes:"512x512",type:"image/png",purpose:"any maskable"}
  ],
  categories:["shopping","lifestyle","fashion"]
};
const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
const mUrl=URL.createObjectURL(blob);
document.getElementById("manifest-link").href=mUrl;

// Service Worker
if("serviceWorker" in navigator){
  const swCode=`
const CACHE='benim-v1';
const ASSETS=['./'];
self.addEventListener('install',e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));
  self.skipWaiting();
});
self.addEventListener('activate',e=>{
  e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(
    caches.match(e.request).then(cached=>cached||fetch(e.request).then(res=>{
      if(res.ok){const clone=res.clone();caches.open(CACHE).then(c=>c.put(e.request,clone));}
      return res;
    })).catch(()=>caches.match('./'))
  );
});
`;
  const swBlob=new Blob([swCode],{type:"application/javascript"});
  const swUrl=URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
